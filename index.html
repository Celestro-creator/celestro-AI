<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Celestro AI</title>
  <!-- Markdown parser library -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; padding: 16px; }
    
    .chat-container { width: 100%; max-width: 720px; background-color: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; }
    .header { padding: 16px; background: #0f172a; border-bottom: 1px solid #334155; text-align: center; }
    .header h1 { font-size: 1.25rem; font-weight: 600; color: #38bdf8; }
    
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background-color: #0284c7; color: #fff; }
    .msg.bot { align-self: flex-start; background-color: #334155; color: #f8fafc; }
    .msg img { max-width: 100%; border-radius: 8px; margin-bottom: 8px; display: block; }

    /* Markdown Styling inside bot messages */
    .msg.bot h1, .msg.bot h2, .msg.bot h3 { margin: 10px 0 6px; color: #38bdf8; }
    .msg.bot p { margin-bottom: 8px; }
    .msg.bot ul, .msg.bot ol { margin-left: 20px; margin-bottom: 8px; }
    .msg.bot hr { border: 0; border-top: 1px solid #475569; margin: 12px 0; }
    .msg.bot code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    
    .camera-modal { display: none; position: relative; background: #000; text-align: center; padding: 8px; }
    .camera-modal video { width: 100%; max-height: 240px; border-radius: 8px; object-fit: cover; }
    
    .preview-bar { display: none; padding: 8px 16px; background: #111827; align-items: center; gap: 10px; }
    .preview-bar img { height: 48px; border-radius: 4px; }
    .preview-bar button { background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    
    .input-area { padding: 12px; background-color: #0f172a; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
    .api-key-row { display: flex; gap: 8px; }
    .api-key-row input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; }
    
    .controls { display: flex; gap: 8px; align-items: center; }
    .controls input[type="text"] { flex: 1; padding: 10px 14px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 8px; outline: none; }
    .btn { background: #38bdf8; border: none; color: #0f172a; font-weight: 600; padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .btn:hover { background: #7dd3fc; }
    .btn-secondary { background: #475569; color: #fff; }
    .btn-secondary:hover { background: #64748b; }
    #fileInput { display: none; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <h1>Celestro AI</h1>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">Hello! I am Celestro AI. How can I help you today?</div>
  </div>

  <!-- Camera Live View -->
  <div class="camera-modal" id="cameraModal">
    <video id="video" autoplay playsinline></video>
    <div style="margin-top: 8px; display: flex; justify-content: center; gap: 8px;">
      <button class="btn" id="snapBtn">Capture Photo</button>
      <button class="btn btn-secondary" id="closeCamBtn">Cancel</button>
    </div>
  </div>

  <!-- Image Attachment Preview -->
  <div class="preview-bar" id="previewBar">
    <img id="previewImg" src="" alt="preview" />
    <span style="font-size: 0.8rem; color: #94a3b8;">Image attached</span>
    <button id="clearImgBtn">Remove</button>
  </div>

  <!-- User Input Controls -->
  <div class="input-area">
    <div class="api-key-row">
      <input type="password" id="apiKey" placeholder="AQ.Ab8RN6JxGxAbS-VKsXPh7i8SERZT64hFU55T2gk9htwZtKA3Yg"/>
    </div>
    <div class="controls">
      <input type="file" id="fileInput" accept="image/*" />
      <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Upload</button>
      <button class="btn btn-secondary" id="openCamBtn">📷 Camera</button>
      <input type="text" id="userInput" placeholder="Ask Celestro AI anything..." />
      <button class="btn" id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  let attachedImageBase64 = null;
  let attachedMimeType = null;
  let videoStream = null;

  const messagesDiv = document.getElementById('messages');
  const userInput = document.getElementById('userInput');
  const apiKeyInput = document.getElementById('apiKey');
  const fileInput = document.getElementById('fileInput');
  const previewBar = document.getElementById('previewBar');
  const previewImg = document.getElementById('previewImg');
  const cameraModal = document.getElementById('cameraModal');
  const video = document.getElementById('video');

  // Convert uploaded image to Base64
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    attachedMimeType = file.type;
    const reader = new FileReader();
    reader.onload = (event) => {
      const dataUrl = event.target.result;
      attachedImageBase64 = dataUrl.split(',')[1];
      showPreview(dataUrl);
    };
    reader.readAsDataURL(file);
  });

  // Request camera permissions and start stream
  document.getElementById('openCamBtn').addEventListener('click', async () => {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = videoStream;
      cameraModal.style.display = 'block';
    } catch (err) {
      alert("Camera permission denied or camera unavailable: " + err.message);
    }
  });

  // Snap image from camera with compression
  document.getElementById('snapBtn').addEventListener('click', () => {
    const canvas = document.createElement('canvas');
    const maxWidth = 800;
    const scale = Math.min(maxWidth / video.videoWidth, 1);
    canvas.width = video.videoWidth * scale;
    canvas.height = video.videoHeight * scale;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
    attachedImageBase64 = dataUrl.split(',')[1];
    attachedMimeType = 'image/jpeg';
    
    stopCamera();
    showPreview(dataUrl);
  });

  document.getElementById('closeCamBtn').addEventListener('click', stopCamera);

  function stopCamera() {
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
    cameraModal.style.display = 'none';
  }

  function showPreview(src) {
    previewImg.src = src;
    previewBar.style.display = 'flex';
  }

  document.getElementById('clearImgBtn').addEventListener('click', () => {
    attachedImageBase64 = null;
    attachedMimeType = null;
    fileInput.value = '';
    previewBar.style.display = 'none';
  });

  // Add user messages
  function addUserMessage(text, imgSrc = null) {
    const msg = document.createElement('div');
    msg.className = 'msg user';
    if (imgSrc) {
      const img = document.createElement('img');
      img.src = imgSrc;
      msg.appendChild(img);
    }
    if (text) {
      const span = document.createElement('span');
      span.textContent = text;
      msg.appendChild(span);
    }
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // Handle send event
  document.getElementById('sendBtn').addEventListener('click', handleSend);
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSend();
  });

  async function handleSend() {
    const text = userInput.value.trim();
    const apiKey = apiKeyInput.value.trim();

    if (!apiKey) {
      alert("Please paste your Gemini API key in the top box.");
      return;
    }
    if (!text && !attachedImageBase64) return;

    // Display user message in UI
    const sentImgData = attachedImageBase64 ? `data:${attachedMimeType};base64,${attachedImageBase64}` : null;
    addUserMessage(text, sentImgData);

    // Build payload parts
    const parts = [];
    if (attachedImageBase64) {
      parts.push({
        inlineData: {
          mimeType: attachedMimeType,
          data: attachedImageBase64
        }
      });
    }
    if (text) {
      parts.push({ text: text });
    }

    // Clear inputs immediately
    userInput.value = '';
    document.getElementById('clearImgBtn').click();

    // Create bot bubble for live streaming
    const botMsgDiv = document.createElement('div');
    botMsgDiv.className = 'msg bot';
    const botContentDiv = document.createElement('div');
    botMsgDiv.appendChild(botContentDiv);
    messagesDiv.appendChild(botMsgDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:streamGenerateContent?alt=sse&key=${apiKey}`;

    const requestBody = {
      systemInstruction: {
        parts: [
          { 
            text: "Your name is Celestro AI. If anyone asks who created you, who made you, or who your developer is, you must state: 'Aryan Sunil Ahire from Podar International School, Nashik made me for helping you.' If asked for your name or identity, always state that you are Celestro AI. Never mention Google or Gemini. Be direct and concise." 
          }
        ]
      },
      contents: [{ role: "user", parts: parts }],
      generationConfig: {
        temperature: 0.7,
    maxOutputTokens: 1024
        }
    };

    let accumulatedText = "";

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestBody)
      });

      if (!res.ok) {
        const errData = await res.json();
        botContentDiv.textContent = `Error: ${errData.error?.message || "Failed to fetch response"}`;
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            const jsonStr = line.replace("data: ", "").trim();
            if (!jsonStr) continue;

            try {
              const parsed = JSON.parse(jsonStr);
              const chunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text || "";
              accumulatedText += chunk;

              if (window.marked) {
                botContentDiv.innerHTML = marked.parse(accumulatedText);
              } else {
                botContentDiv.textContent = accumulatedText;
              }

              messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (e) {
              // Ignore partial JSON buffers
            }
          }
        }
      }
    } catch (err) {
      botContentDiv.textContent = `Request failed: ${err.message}`;
    }
  }
</script>
</body>
</html>
